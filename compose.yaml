name: voicedock

services:
  voicedock:
    build:
      context: .
      target: runtime          # dev ステージ（§18.3）を本番イメージに含めないため必須
      args:
        WHISPER_CPP_REF: v1.9.4

    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Tokyo}
      VOICEDOCK_CONFIG: /app/config/config.yaml

    volumes:
      # ★v4.0: /Volumes はマウントしない（§5.6, §14.4 N-3）
      #   VirtioFS は物理 USB を読めず、読もうとすると Docker 全体が固まりうる
      #   （docs/POC.md §2）。デバイスへ到達できるのはホストの Helper だけである。

      # Helper と共有する作業領域（§4.1）。/Users 配下なので VirtioFS で動く
      - ${VOICEDOCK_HOME:?VOICEDOCK_HOME is required}/inbox:/inbox:rw
      - ${VOICEDOCK_HOME:?VOICEDOCK_HOME is required}/queue:/queue:rw
      # state は Helper の報告。コンテナから改変させない（§18.2）
      - ${VOICEDOCK_HOME:?VOICEDOCK_HOME is required}/state:/state:ro

      # Obsidian Vault
      - ${OBSIDIAN_VAULT:?OBSIDIAN_VAULT is required}:/obsidian:rw

      # SQLite / staging / transcript / analysis
      - voicedock-data:/data

      # Whisper モデル・VAD モデル
      - voicedock-models:/models/whisper

      # 設定とプロンプト
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro

    # TODO(#13): models 長構文（VOICEDOCK_LLM_URL / VOICEDOCK_LLM_MODEL の注入）は #13 で追加する。
    #   Model Runner の有効化とモデル取得（18.6 GB）が前提であり、ここに書くと
    #   make up が無人で巨大なダウンロードを始めうる。
    #   Compose 5 系での注入の実挙動確認も #13 の受け入れ条件である（§18.2, §22 R-21）。

    # health は #12 まで未実装のため、それまでコンテナは (unhealthy) と表示される。
    # 偽の成功を返すスタブを置くより、実態どおり unhealthy と出るほうが正しい。
    healthcheck:
      test: ["CMD", "python", "-m", "voicedock.main", "health"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # ports: は書かない（§14.4 N-13）。公開ポート 0。

volumes:
  # **`name:` を明示する。**書かないと Compose がプロジェクト名を前置して
  # `voicedock_voicedock-models` になり、**`scripts/fetch-models.sh` が書き込む
  # `voicedock-models` とは別の volume をマウントする**（§18.6 の `docker run -v` も同じ名前）。
  # 症状は「574 MB を取得したのに D-8 がモデルを見つけない」であり、
  # 取得の失敗と区別がつかない（2026-09-14 に実機で踏んだ。#95）。
  voicedock-data:
    name: voicedock-data
  voicedock-models:
    name: voicedock-models
